name: Prepare new images

# Whenever you upload images to assets/images/, this makes the small,
# medium and full-size copies plus the blurred previews, rebuilds the
# galleries, and saves the result back to main. GitHub Pages then
# publishes main as usual.

on:
  push:
    branches: [main]
    paths:
      - 'assets/images/**'
      - 'optimize-images.js'
      - 'generate-marketing.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install image tool
        run: npm install --no-save --no-package-lock sharp@0.33

      - name: Make image copies
        run: node optimize-images.js

      - name: Rebuild galleries
        run: node generate-marketing.js

      - name: Save back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/images lib
          git diff --cached --quiet && { echo "Nothing new."; exit 0; }
          git commit -m "Prepare new images [skip ci]"
          git push
